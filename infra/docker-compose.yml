services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: psb
      POSTGRES_PASSWORD: psb
      POSTGRES_DB: psb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psb -d psb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
